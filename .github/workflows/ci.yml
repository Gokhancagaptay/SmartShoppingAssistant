name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  # backend/main.py import sırasında backend/firebase.json ister; dosya .gitignore’da.
  # Repo ayarlarında FIREBASE_SERVICE_ACCOUNT_JSON (tam JSON metni) gizli değişkenini tanımlayın.
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: check
        env:
          SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SECRET" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.has_secret == ‘true’
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: firebase.json (CI)
        if: steps.check.outputs.has_secret == ‘true’
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python -c "import os, pathlib; pathlib.Path(‘firebase.json’).write_text(os.environ[‘FIREBASE_SERVICE_ACCOUNT_JSON’], encoding=’utf-8’)"
      - if: steps.check.outputs.has_secret == ‘true’
        run: pip install -r requirements.txt
      - if: steps.check.outputs.has_secret == ‘true’
        run: python -m pytest tests -q --tb=short
